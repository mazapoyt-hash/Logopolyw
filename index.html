<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер задач</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tracker.css">
</head>
<body>

<header class="tr-header">
  <h1>🐞 Трекер <span>задач</span></h1>
  <p class="tr-subtitle">Баги, идеи и доработки — вместо переписки в мессенджере</p>
</header>

<main class="tr-main">

  <!-- ---------------- Форма создания / редактирования ---------------- -->
  <section class="tr-card">
    <form id="task-form" class="tr-form" autocomplete="off">
      <input type="hidden" id="field-id">

      <label for="field-title">Что нужно сделать / что сломалось</label>
      <input id="field-title" type="text" maxlength="120" placeholder="Например: чат не прокручивается вниз при новом сообщении" required>

      <label for="field-desc">Подробности <span class="tr-hint">(шаги воспроизведения, ссылки — необязательно)</span></label>
      <textarea id="field-desc" rows="3" maxlength="2000" placeholder="1. Открыть чат&#10;2. Написать 10 сообщений&#10;3. Список не доезжает до последнего"></textarea>

      <div class="tr-form-row">
        <div>
          <label for="field-priority">Приоритет</label>
          <select id="field-priority">
            <option value="0">🔥 Критичный — ломает игру</option>
            <option value="1">⬆️ Высокий</option>
            <option value="2" selected>➖ Средний</option>
            <option value="3">⬇️ Низкий — когда-нибудь</option>
          </select>
        </div>
        <div>
          <label for="field-tag">Раздел</label>
          <select id="field-tag">
            <option value="bug" selected>Баг</option>
            <option value="chat">Чат / мессенджер</option>
            <option value="board">Доска / поля</option>
            <option value="trade">Сделки</option>
            <option value="net">Сеть / Firebase</option>
            <option value="ui">Интерфейс</option>
            <option value="idea">Идея / фича</option>
          </select>
        </div>
        <div>
          <label for="field-status">Статус</label>
          <select id="field-status">
            <option value="new" selected>Новая</option>
            <option value="progress">В работе</option>
            <option value="done">Готово</option>
          </select>
        </div>
      </div>

      <div class="tr-form-actions">
        <button type="submit" class="action-btn primary" id="btn-submit">Добавить задачу</button>
        <button type="button" class="action-btn hidden" id="btn-cancel-edit">Отменить правку</button>
      </div>
    </form>
  </section>

  <!-- ---------------- Статистика ---------------- -->
  <section id="stats" class="tr-stats"></section>

  <!-- ---------------- Фильтры и сортировка ---------------- -->
  <section class="tr-card tr-toolbar">
    <input id="filter-search" type="search" placeholder="🔍 Поиск по названию и описанию" class="tr-search">

    <div class="tr-toolbar-row">
      <label class="tr-inline">Сортировка
        <select id="sort-mode">
          <option value="priority" selected>По приоритету</option>
          <option value="created-desc">Сначала новые</option>
          <option value="created-asc">Сначала старые</option>
          <option value="status">По статусу</option>
        </select>
      </label>

      <label class="tr-inline">Приоритет
        <select id="filter-priority">
          <option value="all" selected>Любой</option>
          <option value="0">Критичный</option>
          <option value="1">Высокий</option>
          <option value="2">Средний</option>
          <option value="3">Низкий</option>
        </select>
      </label>

      <label class="tr-inline">Раздел
        <select id="filter-tag">
          <option value="all" selected>Все</option>
          <option value="bug">Баг</option>
          <option value="chat">Чат / мессенджер</option>
          <option value="board">Доска / поля</option>
          <option value="trade">Сделки</option>
          <option value="net">Сеть / Firebase</option>
          <option value="ui">Интерфейс</option>
          <option value="idea">Идея / фича</option>
        </select>
      </label>

      <div class="tr-chips" id="status-chips">
        <button type="button" class="tr-chip active" data-status="all">Все</button>
        <button type="button" class="tr-chip" data-status="open">Открытые</button>
        <button type="button" class="tr-chip" data-status="new">Новые</button>
        <button type="button" class="tr-chip" data-status="progress">В работе</button>
        <button type="button" class="tr-chip" data-status="done">Готовые</button>
      </div>
    </div>
  </section>

  <!-- ---------------- Список ---------------- -->
  <section id="task-list" class="tr-list"></section>

  <!-- ---------------- Данные ---------------- -->
  <section class="tr-card tr-data">
    <h3>Данные</h3>
    <p class="tr-hint">Задачи хранятся в этом браузере (localStorage). Чтобы перенести на другое
      устройство или сохранить резервную копию — выгрузите файл.</p>
    <div class="tr-data-actions">
      <button type="button" class="action-btn" id="btn-export">⬇️ Выгрузить JSON</button>
      <button type="button" class="action-btn" id="btn-import">⬆️ Загрузить JSON</button>
      <button type="button" class="action-btn" id="btn-copy-md">📋 Скопировать списком</button>
      <button type="button" class="action-btn danger" id="btn-clear-done">🧹 Удалить готовые</button>
      <input type="file" id="import-file" accept="application/json,.json" class="hidden">
    </div>
  </section>

</main>

<div id="toast" class="tr-toast hidden"></div>

<script src="tracker.js"></script>
</body>
</html>
